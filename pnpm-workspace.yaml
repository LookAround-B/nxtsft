packages:
  - "apps/*"
  - "packages/*"

# pnpm 10+ refuses to run a dependency's install scripts until it is listed
# here, and exits non-zero (ERR_PNPM_IGNORED_BUILDS) while any are undecided —
# which fails `turbo run build`. Every entry below ships a native binary or
# generated client we genuinely need:
#   prisma / @prisma/engines → query engine + generated client
#   esbuild, sharp, unrs-resolver → prebuilt native binaries
# core-js's postinstall only prints a funding banner, so it stays off.
allowBuilds:
  '@prisma/engines': true
  core-js: false
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Pin hono below 4.12.26 — Prisma 7's @prisma/dev (dev-only) pulls the latest
# hono, which Vercel's supply-chain policy (minimumReleaseAge) rejects as too
# new and fails install. The repo is on pnpm 11 now (see packageManager), so
# THIS is the only place overrides are read from — the duplicate
# package.json#pnpm.overrides is ignored by pnpm 10+ and was removed. Don't
# re-add it expecting it to take effect.
overrides:
  hono: 4.12.25

shared-workspace-lockfile: true
