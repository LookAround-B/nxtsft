# /etc/nginx/sites-available/nxtsft.conf
# certbot --nginx adds the 443 server blocks and the http->https redirect.
# Apex redirects to www, matching what Vercel did (308 nxtsft.com -> www).

server {
    listen 80;
    server_name nxtsft.com;
    return 301 https://www.nxtsft.com$request_uri;
}

server {
    listen 80;
    server_name www.nxtsft.com;

    client_max_body_size 10m;

    # Hashed build assets never change for a given URL.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # trustedClientIp() takes the right-most hop (TRUSTED_PROXY_COUNT=1),
        # which is the $remote_addr nginx appends here.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
